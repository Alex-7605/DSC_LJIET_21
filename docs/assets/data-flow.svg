<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#147D92"/></marker></defs><rect width="1500" height="900" rx="22" fill="#F5F7FB"/><text x="62" y="65" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#16324F">From raw orders to defensible decisions</text><text x="62" y="98" font-family="Arial,sans-serif" font-size="17" fill="#64748B">Order-level analytics and a separate, explicitly trained prediction branch</text><rect x="60" y="145" width="260" height="125" rx="14" fill="white" stroke="#D9E3EE"/><rect x="60" y="160" width="4" height="95" rx="2" fill="#147D92"/><text x="82" y="181" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#16324F">01  Sources</text><text x="82" y="210" font-family="Arial,sans-serif" font-size="15" fill="#64748B">Real Olist order sample</text><text x="82" y="233" font-family="Arial,sans-serif" font-size="15" fill="#64748B">or an uploaded CSV</text><rect x="380" y="145" width="310" height="125" rx="14" fill="white" stroke="#D9E3EE"/><rect x="380" y="160" width="4" height="95" rx="2" fill="#147D92"/><text x="402" y="181" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#16324F">02  Validate &amp; aggregate</text><text x="402" y="210" font-family="Arial,sans-serif" font-size="15" fill="#64748B">Explicit dates, quality, privacy</text><text x="402" y="233" font-family="Arial,sans-serif" font-size="15" fill="#64748B">One record per distinct order</text><rect x="760" y="145" width="300" height="125" rx="14" fill="#16324F" stroke="#D9E3EE"/><rect x="760" y="160" width="4" height="95" rx="2" fill="#147D92"/><text x="782" y="181" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="white">03  Clean order table</text><text x="782" y="210" font-family="Arial,sans-serif" font-size="15" fill="#D7E5EF">Eligible delivery population</text><text x="782" y="233" font-family="Arial,sans-serif" font-size="15" fill="#D7E5EF">Exclusions remain visible</text><rect x="1130" y="145" width="310" height="125" rx="14" fill="white" stroke="#D9E3EE"/><rect x="1130" y="160" width="4" height="95" rx="2" fill="#147D92"/><text x="1152" y="181" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#16324F">Quality report</text><text x="1152" y="210" font-family="Arial,sans-serif" font-size="15" fill="#64748B">Duplicates and invalid records</text><text x="1152" y="233" font-family="Arial,sans-serif" font-size="15" fill="#64748B">Missing values and exclusions</text><path d="M320 207H380" fill="none" stroke="#147D92" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M690 207H760" fill="none" stroke="#147D92" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M1060 207H1130" fill="none" stroke="#147D92" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="210" y="365" width="300" height="125" rx="14" fill="white" stroke="#D9E3EE"/><rect x="210" y="380" width="4" height="95" rx="2" fill="#147D92"/><text x="232" y="401" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#16324F">04A  Shared filters</text><text x="232" y="430" font-family="Arial,sans-serif" font-size="15" fill="#64748B">Date, state, category, outcome</text><text x="232" y="453" font-family="Arial,sans-serif" font-size="15" fill="#64748B">Descriptive scope stays aligned</text><rect x="210" y="555" width="300" height="125" rx="14" fill="white" stroke="#D9E3EE"/><rect x="210" y="570" width="4" height="95" rx="2" fill="#147D92"/><text x="232" y="591" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#16324F">05A  Metrics &amp; evidence</text><text x="232" y="620" font-family="Arial,sans-serif" font-size="15" fill="#64748B">KPI cards, charts, insights</text><text x="232" y="643" font-family="Arial,sans-serif" font-size="15" fill="#64748B">Rates, volume and uncertainty</text><rect x="210" y="740" width="300" height="105" rx="14" fill="white" stroke="#D9E3EE"/><rect x="210" y="755" width="4" height="75" rx="2" fill="#147D92"/><text x="232" y="776" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#16324F">06A  Downloads</text><text x="232" y="805" font-family="Arial,sans-serif" font-size="15" fill="#64748B">CSV and Markdown reports</text><path d="M850 270V315H360V365" fill="none" stroke="#147D92" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M360 490V555" fill="none" stroke="#147D92" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M360 680V740" fill="none" stroke="#147D92" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="860" y="365" width="420" height="125" rx="14" fill="white" stroke="#D9E3EE"/><rect x="860" y="380" width="4" height="95" rx="2" fill="#147D92"/><text x="882" y="401" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#16324F">04B  Chronological model experiment</text><text x="882" y="430" font-family="Arial,sans-serif" font-size="15" fill="#64748B">Placement-time feature allowlist</text><text x="882" y="453" font-family="Arial,sans-serif" font-size="15" fill="#64748B">Train / validation / test + outcome purge</text><rect x="860" y="555" width="420" height="125" rx="14" fill="white" stroke="#D9E3EE"/><rect x="860" y="570" width="4" height="95" rx="2" fill="#147D92"/><text x="882" y="591" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#16324F">05B  Model &amp; threshold selection</text><text x="882" y="620" font-family="Arial,sans-serif" font-size="15" fill="#64748B">Train-only preprocessing; validation selection</text><text x="882" y="643" font-family="Arial,sans-serif" font-size="15" fill="#64748B">Final held-out metrics and calibration</text><rect x="860" y="740" width="420" height="105" rx="14" fill="white" stroke="#D9E3EE"/><rect x="860" y="755" width="4" height="75" rx="2" fill="#147D92"/><text x="882" y="776" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#16324F">06B  Prediction</text><text x="882" y="805" font-family="Arial,sans-serif" font-size="15" fill="#64748B">Validated manual / batch inputs; risk estimate</text><path d="M950 270V315H1070V365" fill="none" stroke="#147D92" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M1070 490V555" fill="none" stroke="#147D92" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M1070 680V740" fill="none" stroke="#147D92" stroke-width="2.4" marker-end="url(#arrow)"/><text x="60" y="884" font-family="Arial,sans-serif" font-size="15" fill="#64748B">Dashboard filters do not change held-out model evaluation. No external prediction API or database is needed.</text></svg>