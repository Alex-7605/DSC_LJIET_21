<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#147D92"/></marker></defs><rect width="1500" height="850" rx="24" fill="#F5F7FB"/><text x="65" y="66" font-family="Arial" font-size="31" font-weight="700" fill="#16324F">One source. Two honest analysis paths.</text><text x="65" y="102" font-family="Arial" font-size="17" fill="#64748B">SupplyLens v2 / General data stays at row grain. Delivery analytics requires a verified mapping.</text><rect x="65" y="155" width="330" height="120" rx="14" fill="white" stroke="#DCE6EF"/><text x="86" y="189" font-family="Arial" font-size="20" font-weight="700" fill="#16324F">01  CSV / TSV / TXT</text><text x="86" y="220" font-family="Arial" font-size="16" fill="#64748B">Source bytes preserved</text><text x="86" y="243" font-family="Arial" font-size="16" fill="#64748B">200 MB / 1M rows / 300 columns</text><rect x="465" y="155" width="420" height="120" rx="14" fill="white" stroke="#DCE6EF"/><text x="486" y="189" font-family="Arial" font-size="20" font-weight="700" fill="#16324F">02  Structure &amp; import options</text><text x="486" y="220" font-family="Arial" font-size="16" fill="#64748B">Encoding, separator, header repair</text><text x="486" y="243" font-family="Arial" font-size="16" fill="#64748B">Explicit source and number conventions</text><rect x="955" y="155" width="480" height="120" rx="14" fill="#16324F" stroke="#DCE6EF"/><text x="976" y="189" font-family="Arial" font-size="20" font-weight="700" fill="white">03  Choose the valid interpretation</text><text x="976" y="220" font-family="Arial" font-size="16" fill="#D0E3ED">General exploration or delivery mapping</text><text x="976" y="243" font-family="Arial" font-size="16" fill="#D0E3ED">No invented arrival dates or target labels</text><path d="M395 215H465" fill="none" stroke="#147D92" stroke-width="2.5" marker-end="url(#a)"/><path d="M885 215H955" fill="none" stroke="#147D92" stroke-width="2.5" marker-end="url(#a)"/><rect x="105" y="370" width="470" height="125" rx="14" fill="white" stroke="#DCE6EF"/><text x="126" y="404" font-family="Arial" font-size="20" font-weight="700" fill="#16324F">04A  General data workspace</text><text x="126" y="435" font-family="Arial" font-size="16" fill="#64748B">Conservative types; detected PII excluded</text><text x="126" y="458" font-family="Arial" font-size="16" fill="#64748B">Source rows preserved; search and filters</text><rect x="105" y="560" width="470" height="125" rx="14" fill="white" stroke="#DCE6EF"/><text x="126" y="594" font-family="Arial" font-size="20" font-weight="700" fill="#16324F">05A  Profiles, charts &amp; export bundle</text><text x="126" y="625" font-family="Arial" font-size="16" fill="#64748B">Counts, distributions, groups and relationships</text><text x="126" y="648" font-family="Arial" font-size="16" fill="#64748B">Selected CSV + profile + provenance manifest</text><path d="M1080 275V320H340V370" fill="none" stroke="#147D92" stroke-width="2.5" marker-end="url(#a)"/><path d="M340 495V560" fill="none" stroke="#147D92" stroke-width="2.5" marker-end="url(#a)"/><rect x="785" y="370" width="610" height="125" rx="14" fill="white" stroke="#DCE6EF"/><text x="806" y="404" font-family="Arial" font-size="20" font-weight="700" fill="#16324F">04B  Explicit delivery mapping &amp; validation</text><text x="806" y="435" font-family="Arial" font-size="16" fill="#64748B">Aggregate items to orders; establish eligible deliveries</text><text x="806" y="458" font-family="Arial" font-size="16" fill="#64748B">Exclude cancelled, undelivered and unknown outcomes</text><rect x="785" y="560" width="610" height="125" rx="14" fill="white" stroke="#DCE6EF"/><text x="806" y="594" font-family="Arial" font-size="20" font-weight="700" fill="#16324F">05B  Metrics, insights &amp; temporal experiment</text><text x="806" y="625" font-family="Arial" font-size="16" fill="#64748B">Shared filters → KPI cards, comparisons and reports</text><text x="806" y="648" font-family="Arial" font-size="16" fill="#64748B">Placement-time features → train / validation / test</text><path d="M1250 275V320H1090V370" fill="none" stroke="#147D92" stroke-width="2.5" marker-end="url(#a)"/><path d="M1090 495V560" fill="none" stroke="#147D92" stroke-width="2.5" marker-end="url(#a)"/><rect x="445" y="735" width="610" height="76" rx="14" fill="#16324F" stroke="#DCE6EF"/><text x="466" y="769" font-family="Arial" font-size="20" font-weight="700" fill="white">06  Explain the evidence</text><text x="466" y="800" font-family="Arial" font-size="16" fill="#D0E3ED">Guided viva tour · printable report · honest limitations</text><path d="M340 685V775H445" fill="none" stroke="#147D92" stroke-width="2.5" marker-end="url(#a)"/><path d="M1090 685V775H1055" fill="none" stroke="#147D92" stroke-width="2.5" marker-end="url(#a)"/></svg>